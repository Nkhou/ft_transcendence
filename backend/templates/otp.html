<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f8;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: linear-gradient(135deg, #6c63ff, #7b49ff);
            border-radius: 10px;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        .otp-code {
            font-size: 22px;
            font-weight: bold;
            background-color: #fff;
            color: #6c63ff;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 10px 0;
        }
        .footer {
            font-size: 12px;
            margin-top: 20px;
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h1>OTP Verification</h1>
        <p>Hi {{user.username}},</p>
        <p>Your OTP for login is:</p>
        <div class="otp-code">{{codeVerify}}</div>
        <p>Please enter this code to complete your login.</p>
        <p>If you did not request this, please ignore this email.</p>
        <div class="footer">
            <p>© 2024 PING PONG . All rights reserved.</p>
        </div>
    </div>
</body>
</html>
